[variables]
NIXPACKS_PHP_VERSION = "8.4"
NIXPACKS_NODE_VERSION = "20"

[phases.setup]
nixPkgs = [
  "php84",
  "php84Extensions.pdo_pgsql",
  "php84Extensions.pgsql",
  "php84Extensions.mbstring",
  "php84Extensions.xml",
  "php84Extensions.curl",
  "php84Extensions.zip",
  "php84Extensions.gd",
  "php84Extensions.intl",
  "php84Extensions.bcmath",
  "php84Extensions.opcache",
  "nodejs_20",
]

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader --no-interaction",
  "npm ci",
]

[phases.build]
cmds = [
  "npm run build",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache",
  "php artisan storage:link || true",
]

[start]
cmd = "php artisan migrate --force && php artisan tinker --execute=\"if (App\\Models\\Tournament::count() === 0) { Artisan::call('db:seed', ['--class' => 'Database\\\\Seeders\\\\DemoSeeder', '--force' => true]); }\" && php artisan serve --host=0.0.0.0 --port=$PORT"