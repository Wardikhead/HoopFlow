<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournaments — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content">
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h5 class="fw-bold mb-0">Tournaments</h5>
        <a href="create.html" class="btn btn-sm btn-hf-primary" data-role-required="organizer">
          <i class="bi bi-plus-lg me-1"></i> Add Tournament
        </a>
      </div>

      <!-- Quick Filter Pills -->
      <div class="hf-filter-pills">
        <button class="hf-filter-pill active" onclick="setDivisionFilter(this, 'all')">All Divisions (3)</button>
        <button class="hf-filter-pill" onclick="setDivisionFilter(this, 'U18')">Under 18 (U18)</button>
        <button class="hf-filter-pill" onclick="setDivisionFilter(this, 'U16')">Under 16 (U16)</button>
        <button class="hf-filter-pill" onclick="setDivisionFilter(this, 'U14')">Under 14 (U14)</button>
      </div>

      <!-- Search & Filter Controls (matches wireframe) -->
      <div class="hf-search-box mb-2">
        <input type="text" placeholder="Search tournament name, division, venue..." id="tourneySearch">
        <i class="bi bi-search"></i>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="dropdown">
          <button class="btn btn-sm btn-hf-outline dropdown-toggle py-1" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-funnel me-1"></i> Filter By: All Divisions
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">All Divisions</a></li>
            <li><a class="dropdown-item" href="#">Under 18 (U18)</a></li>
            <li><a class="dropdown-item" href="#">Under 16 (U16)</a></li>
            <li><a class="dropdown-item" href="#">Under 14 (U14)</a></li>
          </ul>
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-hf-outline dropdown-toggle py-1" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-sort-down me-1"></i> Sort By: Date
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Date (Newest)</a></li>
            <li><a class="dropdown-item" href="#">Status</a></li>
            <li><a class="dropdown-item" href="#">Available Slots</a></li>
          </ul>
        </div>
      </div>

      <!-- Tournament Cards List -->
      <div id="tournamentsList">
        <!-- Rendered by JS -->
      </div>

      <!-- Pagination Dots (matches wireframe footer) -->
      <div class="d-flex justify-content-center gap-2 py-3">
        <span class="hf-splash-dot active"></span>
        <span class="hf-splash-dot"></span>
        <span class="hf-splash-dot"></span>
      </div>
    </main>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const db = window.HF.get();
      const listEl = document.getElementById('tournamentsList');
      let activeDivision = 'all';

      window.setDivisionFilter = function(btn, div) {
        document.querySelectorAll('.hf-filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeDivision = div;
        applyFilters();
      };

      function render(items) {
        if (items.length === 0) {
          listEl.innerHTML = `
            <div class="text-center py-5">
              <i class="bi bi-trophy text-muted display-4 mb-2 d-block opacity-25"></i>
              <h6 class="fw-bold text-muted">No tournaments found for this division</h6>
              <small class="text-muted">Try selecting "All Divisions" or clear your search query.</small>
            </div>
          `;
          return;
        }

        listEl.innerHTML = items.map(t => `
          <div class="hf-card hf-card-interactive mb-3 p-3">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <span class="badge bg-warning-subtle text-warning-emphasis fw-bold">${t.division}</span>
              <span class="badge ${t.status === 'Active' ? 'bg-success-subtle text-success' : 'bg-primary-subtle text-primary'}">${t.status}</span>
            </div>
            <h5 class="fw-bold mb-1">${t.name}</h5>
            <div class="text-muted small mb-2"><i class="bi bi-calendar3 me-1"></i>${t.dates}</div>
            <div class="text-muted small mb-3"><i class="bi bi-geo-alt me-1"></i>${t.venue}</div>
            <p class="small text-muted mb-3">${t.description}</p>
            
            <div class="d-flex justify-content-between align-items-center pt-2 border-top">
              <span class="small fw-semibold text-secondary">
                <i class="bi bi-people me-1"></i>${t.registeredCount} / ${t.slots} Teams
              </span>
              <a href="show.html?id=${t.id}" class="btn btn-sm btn-hf-primary py-1 px-3">
                View Tournament <i class="bi bi-chevron-right ms-1"></i>
              </a>
            </div>
          </div>
        `).join('');
      }

      function applyFilters() {
        const query = document.getElementById('tourneySearch').value.toLowerCase();
        const filtered = db.tournaments.filter(t => {
          const matchDiv = activeDivision === 'all' || t.division.toLowerCase().includes(activeDivision.toLowerCase());
          const matchQuery = t.name.toLowerCase().includes(query) || t.venue.toLowerCase().includes(query);
          return matchDiv && matchQuery;
        });
        render(filtered);
      }

      render(db.tournaments);
      document.getElementById('tourneySearch').addEventListener('input', applyFilters);
    });
  </script>
</body>
</html>
