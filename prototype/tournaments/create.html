<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Tournament — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content pb-5">
      <div class="mb-3">
        <h5 class="fw-bold mb-1">Create New Tournament</h5>
        <p class="text-muted small">Configure competition rules, courts, and team registration limits.</p>
      </div>

      <form id="createTourneyForm" onsubmit="handleCreateTournament(event)">
        <!-- Tournament Logo Circle (matches wireframe 30:734) -->
        <div class="text-center mb-4">
          <div class="d-inline-flex flex-column align-items-center justify-content-center bg-white border border-2 border-dashed rounded-circle p-3" style="width: 110px; height: 110px; cursor: pointer;">
            <i class="bi bi-camera text-muted fs-2"></i>
            <span style="font-size: 0.65rem;" class="text-muted fw-bold">Upload Logo</span>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-dark">Tournament Name</label>
          <input type="text" id="tNameInput" class="form-control" placeholder="e.g. 2026 Pasig Summer Hoopfest" required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small fw-bold text-dark">Team Slots</label>
            <select id="tSlots" class="form-select" required>
              <option value="8" selected>8 Teams (Power of 2)</option>
              <option value="16">16 Teams</option>
              <option value="32">32 Teams</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold text-dark">Age Division</label>
            <select id="tDivisionInput" class="form-select" required>
              <option value="Under 18 (U18)" selected>Under 18 (U18)</option>
              <option value="Under 16 (U16)">Under 16 (U16)</option>
              <option value="Under 14 (U14)">Under 14 (U14)</option>
              <option value="Under 12 (U12)">Under 12 (U12)</option>
            </select>
          </div>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small fw-bold text-dark">Start Date</label>
            <input type="date" class="form-control" value="2026-06-01" required>
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold text-dark">End Date</label>
            <input type="date" class="form-control" value="2026-06-08" required>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-dark">Primary Venue & Courts</label>
          <input type="text" id="tVenueInput" class="form-control" placeholder="e.g. Pasig Central Sports Complex (Courts 1 & 2)" required>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-dark">Tournament Format & Elimination Rule</label>
          <select class="form-select" required>
            <option value="Single Elimination" selected>Single Elimination (v1 Standard)</option>
            <option value="Round Robin">Round Robin Pool Play + Top 2 Playoffs</option>
          </select>
          <div class="form-text small">Single elimination calculates automatic seed byes for top-ranked squads.</div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-dark">Description & Eligibility Guidelines</label>
          <textarea id="tDescInput" class="form-control" rows="3" placeholder="Provide entry fee details, required PSA documents, and rules..."></textarea>
        </div>

        <div class="pt-2">
          <button type="submit" class="btn btn-hf-primary w-100 py-3 fs-6">
            <i class="bi bi-cloud-arrow-up-fill me-1"></i> Publish Tournament
          </button>
        </div>
      </form>
    </main>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    function handleCreateTournament(e) {
      e.preventDefault();
      const db = window.HF.get();
      const newTourney = {
        id: 'tourney-' + (db.tournaments.length + 1),
        name: document.getElementById('tNameInput').value,
        division: document.getElementById('tDivisionInput').value,
        type: 'Single Elimination',
        slots: parseInt(document.getElementById('tSlots').value),
        registeredCount: 0,
        dates: 'June 01 - June 08, 2026',
        venue: document.getElementById('tVenueInput').value,
        courts: ['Court 1', 'Court 2'],
        status: 'Registration Open',
        description: document.getElementById('tDescInput').value || 'New tournament.'
      };

      db.tournaments.unshift(newTourney);
      window.HF.save(db);
      alert('Tournament published successfully!');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
