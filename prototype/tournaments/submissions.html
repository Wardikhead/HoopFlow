<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Submissions — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content pb-5">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
          <h5 class="fw-bold mb-0">Team Submissions</h5>
          <small class="text-muted">Review team rosters & eligibility waivers</small>
        </div>
        <span class="badge bg-warning text-dark" id="pendingCounter">2 Pending</span>
      </div>

      <!-- Search Bar (matches wireframe) -->
      <div class="hf-search-box mb-3">
        <input type="text" placeholder="Search submitted teams or coach name..." id="submissionSearch">
        <i class="bi bi-search"></i>
      </div>

      <!-- Submission Cards List (matches wireframe 13:314) -->
      <div id="submissionsList">
        <!-- Rendered by JS -->
      </div>
    </main>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const db = window.HF.get();
      const listEl = document.getElementById('submissionsList');
      const counterEl = document.getElementById('pendingCounter');

      function render(teams) {
        const pendingCount = db.teams.filter(t => t.status === 'Pending').length;
        counterEl.textContent = `${pendingCount} Pending`;

        listEl.innerHTML = teams.map(team => {
          const isPending = team.status === 'Pending';
          const isApproved = team.status === 'Approved';
          const isRejected = team.status === 'Rejected';

          return `
            <div class="hf-card p-3 mb-3">
              <div class="d-flex align-items-center justify-content-between mb-2">
                <div class="d-flex align-items-center gap-2">
                  <div class="hf-avatar text-white" style="background: ${team.avatarColor}; width: 40px; height: 40px; font-size: 0.8rem;">
                    ${team.shortName}
                  </div>
                  <div>
                    <h6 class="fw-bold mb-0">${team.name}</h6>
                    <small class="text-muted"><i class="bi bi-person me-1"></i>Coach: ${team.coach}</small>
                  </div>
                </div>
                <span class="badge ${isApproved ? 'bg-success-subtle text-success' : (isRejected ? 'bg-danger-subtle text-danger' : 'bg-warning-subtle text-warning-emphasis')}">
                  ${team.status}
                </span>
              </div>

              <div class="bg-light p-2 rounded-3 small text-muted mb-3 d-flex justify-content-between">
                <span><i class="bi bi-file-earmark-check me-1 text-success"></i>12 Players &amp; Waivers</span>
                <span><i class="bi bi-credit-card me-1"></i>Fee: ${team.paymentStatus}</span>
              </div>

              <!-- Action Buttons (matches wireframe 13:314) -->
              <div class="d-flex gap-2">
                <button type="button" class="btn btn-sm btn-outline-danger w-50 py-2 fw-semibold" onclick="updateTeamStatus('${team.id}', 'Rejected')">
                  <i class="bi bi-x-circle me-1"></i> Reject Team
                </button>
                <button type="button" class="btn btn-sm btn-success w-50 py-2 fw-semibold" onclick="updateTeamStatus('${team.id}', 'Approved')">
                  <i class="bi bi-check-circle me-1"></i> Accept Team
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      window.updateTeamStatus = function(teamId, newStatus) {
        const team = db.teams.find(t => t.id === teamId);
        if (team) {
          team.status = newStatus;
          window.HF.save(db);
          render(db.teams);
          if (newStatus === 'Approved') {
            window.HF.toast('Team Approved! 🎉', `${team.name} has been verified and added to the tournament bracket pool.`, 'success');
          } else {
            window.HF.toast('Team Registration Rejected', `${team.name} submission was declined.`, 'danger');
          }
        }
      };

      render(db.teams);

      document.getElementById('submissionSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        render(db.teams.filter(t => t.name.toLowerCase().includes(q) || t.coach.toLowerCase().includes(q)));
      });
    });
  </script>
</body>
</html>
