<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Payments — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content pb-5">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
          <h5 class="fw-bold mb-0">Team Payment Records</h5>
          <small class="text-muted">Tournament entry fee verification (₱1,500/team)</small>
        </div>
      </div>

      <!-- Search Bar (matches wireframe) -->
      <div class="hf-search-box mb-3">
        <input type="text" placeholder="Search team or receipt/reference code..." id="paymentSearch">
        <i class="bi bi-search"></i>
      </div>

      <!-- Payment Summary Row -->
      <div class="row g-2 mb-3">
        <div class="col-6">
          <div class="hf-card p-2 text-center mb-0 bg-success-subtle border-success">
            <span class="fs-5 fw-bold text-success">6 Paid</span>
            <small class="d-block text-muted" style="font-size: 0.7rem;">₱9,000 Collected</small>
          </div>
        </div>
        <div class="col-6">
          <div class="hf-card p-2 text-center mb-0 bg-warning-subtle border-warning">
            <span class="fs-5 fw-bold text-warning-emphasis">2 Pending</span>
            <small class="d-block text-muted" style="font-size: 0.7rem;">₱3,000 Uncollected</small>
          </div>
        </div>
      </div>

      <!-- Payment Rows (matches wireframe 13:408) -->
      <div id="paymentsList">
        <!-- Rendered by JS -->
      </div>
    </main>

    <!-- Update Payment Modal -->
    <div class="modal fade" id="paymentModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header">
            <h6 class="modal-title fw-bold" id="modalTeamName">Update Payment Status</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <input type="hidden" id="modalTeamId">
            <div class="mb-3">
              <label class="form-label small fw-bold">Payment Method</label>
              <select id="modalPayMethod" class="form-select">
                <option value="GCash">GCash E-Wallet</option>
                <option value="Maya">Maya E-Wallet</option>
                <option value="Cash">Cash (Handed to Organizer)</option>
                <option value="Bank">Bank Transfer (BDO/BPI)</option>
              </select>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Reference / Receipt Number</label>
              <input type="text" id="modalPayRef" class="form-control" placeholder="e.g. GCASH-9823412" required>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Payment Status</label>
              <select id="modalPayStatus" class="form-select">
                <option value="Paid">Paid in Full (₱1,500)</option>
                <option value="Partial">Partial Deposit</option>
                <option value="Pending">Pending / Unpaid</option>
              </select>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-sm btn-hf-primary" onclick="savePaymentUpdate()">Save Changes</button>
          </div>
        </div>
      </div>
    </div>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const db = window.HF.get();
      const listEl = document.getElementById('paymentsList');
      const modal = new bootstrap.Modal(document.getElementById('paymentModal'));

      function render(teams) {
        listEl.innerHTML = teams.map(team => {
          const isPaid = team.paymentStatus === 'Paid';
          return `
            <div class="hf-card p-3 mb-2">
              <div class="d-flex align-items-center justify-content-between mb-2">
                <div class="d-flex align-items-center gap-2">
                  <div class="hf-avatar text-white" style="background: ${team.avatarColor}; width: 36px; height: 36px; font-size: 0.75rem;">
                    ${team.shortName}
                  </div>
                  <div>
                    <h6 class="fw-bold mb-0">${team.name}</h6>
                    <small class="text-muted">Coach: ${team.coach}</small>
                  </div>
                </div>
                <span class="badge ${isPaid ? 'bg-success text-white' : 'bg-warning text-dark'}">
                  ${team.paymentStatus}
                </span>
              </div>
              <div class="d-flex justify-content-between align-items-center pt-2 border-top small text-muted">
                <span><i class="bi bi-hash me-1"></i>Ref: <strong>${team.paymentRef}</strong></span>
                <button type="button" class="btn btn-sm btn-hf-outline py-1 px-3" onclick="openPaymentModal('${team.id}')">
                  Update Status <i class="bi bi-pencil-square ms-1"></i>
                </button>
              </div>
            </div>
          `;
        }).join('');
      }

      window.openPaymentModal = function(teamId) {
        const team = db.teams.find(t => t.id === teamId);
        if (team) {
          document.getElementById('modalTeamId').value = team.id;
          document.getElementById('modalTeamName').textContent = `Update Payment: ${team.name}`;
          document.getElementById('modalPayStatus').value = team.paymentStatus;
          document.getElementById('modalPayRef').value = team.paymentRef === 'Unpaid' ? '' : team.paymentRef;
          modal.show();
        }
      };

      window.savePaymentUpdate = function() {
        const teamId = document.getElementById('modalTeamId').value;
        const team = db.teams.find(t => t.id === teamId);
        if (team) {
          team.paymentStatus = document.getElementById('modalPayStatus').value;
          team.paymentRef = document.getElementById('modalPayRef').value || 'MANUAL-REF';
          window.HF.save(db);
          modal.hide();
          render(db.teams);
        }
      };

      render(db.teams);

      document.getElementById('paymentSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        render(db.teams.filter(t => t.name.toLowerCase().includes(q) || t.paymentRef.toLowerCase().includes(q)));
      });
    });
  </script>
</body>
</html>
