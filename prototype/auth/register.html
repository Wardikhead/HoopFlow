<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div class="hf-content d-flex flex-column justify-content-between py-4">
      <!-- Top Bar -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <img src="../assets/img/logo.png" alt="HoopFlow" class="hf-brand-logo" onerror="this.src='../assets/img/hoopflow%20lockup%20horizontal%20on%20white.png'">
        <a href="login.html" class="hf-icon-btn"><i class="bi bi-chevron-left"></i></a>
      </div>

      <!-- Main Form (Centered Card on Desktop) -->
      <div class="my-auto py-2 auth-desktop-card w-100">
        <div class="text-center mb-3">
          <h2 class="fw-bold mb-1">Create Account</h2>
          <p class="text-muted small">
            Already registered? <a href="login.html" class="text-decoration-none fw-semibold" style="color: var(--hf-primary);">Sign in here</a>
          </p>
        </div>

        <form id="registerForm" onsubmit="handleRegister(event)">
          <!-- Role selector as FIRST field (matches wireframe 5:58) -->
          <div class="mb-3">
            <label class="form-label small fw-bold text-dark">Select Your Role</label>
            <div class="input-group">
              <span class="input-group-text bg-white border-end-0"><i class="bi bi-person-badge text-warning"></i></span>
              <select id="regRole" class="form-select border-start-0 py-2 fw-semibold" required>
                <option value="organizer">Organizer (Tournament Director / Admin)</option>
                <option value="coach" selected>Coach / Team Manager</option>
                <option value="fan">Fan / Parent Spectator</option>
              </select>
            </div>
            <div class="form-text small" id="roleHelp">Coaches can manage rosters and register teams into tournaments.</div>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Full Name / Organization</label>
            <input type="text" id="regName" class="form-control py-2" placeholder="e.g. Coach Marcus Rivera" required>
          </div>

          <div class="mb-3">
            <label class="form-label small fw-semibold text-muted">Email Address</label>
            <input type="email" id="regEmail" class="form-control py-2" placeholder="name@domain.ph" required>
          </div>

          <div class="row g-2 mb-3">
            <div class="col-6">
              <label class="form-label small fw-semibold text-muted">Password</label>
              <input type="password" id="regPassword" class="form-control py-2" placeholder="••••••••" required>
            </div>
            <div class="col-6">
              <label class="form-label small fw-semibold text-muted">Confirm Password</label>
              <input type="password" id="regPasswordConfirm" class="form-control py-2" placeholder="••••••••" required>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" id="regTerms" required checked>
            <label class="form-check-label small text-muted" for="regTerms">
              I certify adherence to youth basketball eligibility guidelines and guardian consent policies.
            </label>
          </div>

          <button type="submit" class="btn btn-hf-primary w-100 py-3 fs-6">
            Sign Up <i class="bi bi-check-circle ms-1"></i>
          </button>
        </form>
      </div>

      <div class="text-center text-muted small pt-2">
        HoopFlow Grassroots Youth System
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    const roleSelect = document.getElementById('regRole');
    const roleHelp = document.getElementById('roleHelp');

    roleSelect.addEventListener('change', () => {
      const val = roleSelect.value;
      if (val === 'organizer') {
        roleHelp.textContent = 'Organizers can create tournaments, allocate courts, approve teams, and record game scores.';
      } else if (val === 'coach') {
        roleHelp.textContent = 'Coaches can manage rosters and register teams into tournaments.';
      } else {
        roleHelp.textContent = 'Fans can follow live brackets, game schedules, and team standings.';
      }
    });

    function handleRegister(e) {
      e.preventDefault();
      const role = document.getElementById('regRole').value;
      localStorage.setItem('hoopflow_role', role);
      window.location.href = '../dashboard/index.html';
    }
  </script>
</body>
</html>
