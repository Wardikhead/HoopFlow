<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Profile — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content pb-5">
      <!-- Profile Card (matches wireframe 31:865 / 31:1466) -->
      <div class="hf-card text-center p-4 mb-3 bg-white">
        <div class="hf-avatar hf-avatar-xl mx-auto mb-3 bg-dark text-white shadow-sm border border-3 border-light">
          <i class="bi bi-person-fill display-5"></i>
        </div>
        <h5 class="fw-bold mb-1" id="profileName">Coach Marcus Rivera</h5>
        <span class="badge bg-warning-subtle text-warning-emphasis fw-bold mb-2" id="profileRoleBadge">ORGANIZER</span>
        <div class="small text-muted mb-3" id="profileEmail">marcus.rivera@hoopflow.ph</div>

        <button type="button" class="btn btn-sm btn-hf-outline px-4 py-2" data-bs-toggle="modal" data-bs-target="#editProfileModal">
          <i class="bi bi-pencil me-1"></i> Edit Profile
        </button>
      </div>

      <!-- User Details Form / Info fields (matches wireframe) -->
      <div class="hf-card p-3 mb-3 bg-white">
        <span class="small fw-bold text-muted text-uppercase d-block mb-3">Official Details</span>

        <div class="mb-3">
          <label class="small text-muted">Organization / Barangay</label>
          <div class="fw-semibold text-dark">Barangay San Antonio Sports Development Council</div>
        </div>

        <div class="mb-3">
          <label class="small text-muted">Accreditation / ID</label>
          <div class="fw-semibold text-dark">SBP-NCR-2026-0881</div>
        </div>

        <div class="mb-3">
          <label class="small text-muted">Contact Phone</label>
          <div class="fw-semibold text-dark">+63 917 555 0192</div>
        </div>

        <div>
          <label class="small text-muted">Data Privacy Compliance</label>
          <div class="small text-success"><i class="bi bi-check-circle-fill me-1"></i>RA 10173 Verified &bull; Minor Consent Custodian</div>
        </div>
      </div>

      <!-- Quick Session Controls -->
      <div class="hf-card p-3 bg-white">
        <span class="small fw-bold text-muted text-uppercase d-block mb-2">Account Actions</span>
        <div class="d-flex flex-column gap-2">
          <a href="../auth/login.html" class="btn btn-outline-danger btn-sm py-2 text-start d-flex justify-content-between align-items-center">
            <span><i class="bi bi-box-arrow-right me-2"></i> Sign Out</span>
            <i class="bi bi-chevron-right"></i>
          </a>
        </div>
      </div>
    </main>

    <!-- Edit Profile Modal -->
    <div class="modal fade" id="editProfileModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header">
            <h6 class="modal-title fw-bold">Edit Profile Information</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small fw-bold">Display Name</label>
              <input type="text" id="editNameInput" class="form-control" value="Marcus Rivera">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Email Address</label>
              <input type="email" id="editEmailInput" class="form-control" value="marcus.rivera@hoopflow.ph">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Organization</label>
              <input type="text" class="form-control" value="Barangay San Antonio Sports Council">
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-sm btn-hf-primary" onclick="saveProfile()">Save Changes</button>
          </div>
        </div>
      </div>
    </div>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const role = window.HF ? window.HF.getRole() : 'organizer';
      document.getElementById('profileRoleBadge').textContent = role.toUpperCase();
      if (role === 'organizer') {
        document.getElementById('profileName').textContent = 'Tournament Director Mahinay';
        document.getElementById('profileEmail').textContent = 'organizer@hoopflow.ph';
      } else if (role === 'coach') {
        document.getElementById('profileName').textContent = 'Coach Marcus Rivera';
        document.getElementById('profileEmail').textContent = 'coach.marcus@hoopflow.ph';
      } else {
        document.getElementById('profileName').textContent = 'Juan De La Cruz';
        document.getElementById('profileEmail').textContent = 'fan.juan@hoopflow.ph';
      }
    });

    function saveProfile() {
      const newName = document.getElementById('editNameInput').value;
      if (newName) {
        document.getElementById('profileName').textContent = newName;
      }
      const modal = bootstrap.Modal.getInstance(document.getElementById('editProfileModal'));
      if (modal) modal.hide();
      alert('Profile updated successfully!');
    }
  </script>
</body>
</html>
