<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matchups &amp; Game Selection — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content pb-5">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
          <h5 class="fw-bold mb-0">Select Match Schedule</h5>
          <small class="text-muted">Explore match cards &amp; live box scores</small>
        </div>
      </div>

      <!-- Search Bar (matches wireframe) -->
      <div class="hf-search-box mb-3">
        <input type="text" placeholder="Search by team name or court..." id="matchSearch">
        <i class="bi bi-search"></i>
      </div>

      <!-- Matchup Cards List (matches wireframe 72:231) -->
      <div id="allMatchesContainer">
        <!-- Rendered by JS -->
      </div>
    </main>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const db = window.HF.get();
      const listEl = document.getElementById('allMatchesContainer');

      function render(matches) {
        listEl.innerHTML = matches.map(m => `
          <div class="hf-card p-3 mb-3">
            <div class="d-flex justify-content-between align-items-center small text-muted mb-2">
              <span class="badge bg-light text-dark border"><i class="bi bi-geo-alt me-1 text-primary"></i>${m.court}</span>
              <div class="dropdown">
                <button class="btn btn-sm btn-link text-muted p-0" type="button" data-bs-toggle="dropdown">
                  <i class="bi bi-three-dots"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end">
                  <li><a class="dropdown-item small" href="../games/stats.html?match=${m.id}"><i class="bi bi-bar-chart me-2"></i>Box Score</a></li>
                  <li><a class="dropdown-item small" href="#"><i class="bi bi-share me-2"></i>Share Matchup</a></li>
                </ul>
              </div>
            </div>

            <!-- Team VS Team (matches wireframe) -->
            <div class="d-flex justify-content-between align-items-center my-3 px-2">
              <div class="text-center" style="flex: 1;">
                <div class="hf-avatar mx-auto mb-1 text-white" style="background: #ea580c; width: 40px; height: 40px;">
                  ${m.team1.substring(0, 2)}
                </div>
                <div class="fw-bold text-dark small text-truncate">${m.team1}</div>
                <span class="fs-5 fw-bold text-dark">${m.score1}</span>
              </div>

              <div class="text-center px-2">
                <span class="badge bg-secondary-subtle text-muted fw-bold">VS</span>
                <div class="small text-muted mt-1" style="font-size: 0.65rem;">${m.time}</div>
              </div>

              <div class="text-center" style="flex: 1;">
                <div class="hf-avatar mx-auto mb-1 text-white" style="background: #2563eb; width: 40px; height: 40px;">
                  ${m.team2.substring(0, 2)}
                </div>
                <div class="fw-bold text-dark small text-truncate">${m.team2}</div>
                <span class="fs-5 fw-bold text-dark">${m.score2}</span>
              </div>
            </div>

            <!-- Action Button (matches wireframe 'View Game Details') -->
            <div class="pt-2 border-top">
              <a href="../games/stats.html?match=${m.id}" class="btn btn-hf-outline w-100 py-2 fs-6 d-flex align-items-center justify-content-center gap-1">
                <i class="bi bi-eye"></i> View Game Details
              </a>
            </div>
          </div>
        `).join('');
      }

      render(db.bracketMatches);

      document.getElementById('matchSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        render(db.bracketMatches.filter(m => m.team1.toLowerCase().includes(q) || m.team2.toLowerCase().includes(q) || m.court.toLowerCase().includes(q)));
      });
    });
  </script>
</body>
</html>
