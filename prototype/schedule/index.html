<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Calendar Schedule — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content pb-5">
      <!-- Schedule Header -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
          <h5 class="fw-bold mb-0">Court &amp; Game Schedule</h5>
          <small class="text-muted">May 2026 &bull; San Antonio Sports Complex (Courts 1 &amp; 2)</small>
        </div>
        <!-- ORGANIZER SCHEDULING CONTROLS (Matches wireframe 23:198) -->
        <div class="d-flex gap-2" data-role-required="organizer">
          <button class="btn btn-sm btn-hf-outline py-1" onclick="alert('Checking court conflict constraints: No overlapping slots found!')">
            <i class="bi bi-calendar2-range me-1"></i> Re Schedule
          </button>
          <button class="btn btn-sm btn-hf-outline py-1" onclick="alert('Regenerating court allocations with minimum 90-minute team rest buffer...')">
            <i class="bi bi-magic me-1"></i> Regenerate Schedule
          </button>
        </div>
      </div>

      <!-- DESKTOP 2-COLUMN GRID (Calendar on left, Day Matches on right) -->
      <div class="row g-4">
        <div class="col-12 col-lg-5">
          <!-- CALENDAR MONTH GRID (Matches wireframe 23:198 / 27:520) -->
          <div class="hf-card p-3 mb-3 bg-white">
            <div class="d-flex justify-content-between align-items-center mb-3">
              <button class="btn btn-sm btn-light border py-0 px-2"><i class="bi bi-chevron-left"></i></button>
              <span class="fw-bold fs-6">May 2026</span>
              <button class="btn btn-sm btn-light border py-0 px-2"><i class="bi bi-chevron-right"></i></button>
            </div>

            <div class="hf-calendar-grid mb-1">
              <div class="hf-calendar-day-header">S</div>
              <div class="hf-calendar-day-header">M</div>
              <div class="hf-calendar-day-header">T</div>
              <div class="hf-calendar-day-header">W</div>
              <div class="hf-calendar-day-header">T</div>
              <div class="hf-calendar-day-header">F</div>
              <div class="hf-calendar-day-header">S</div>
            </div>

            <!-- Days -->
            <div class="hf-calendar-grid">
              <!-- Week 1 -->
              <div class="hf-calendar-cell text-muted opacity-50">26</div>
              <div class="hf-calendar-cell text-muted opacity-50">27</div>
              <div class="hf-calendar-cell text-muted opacity-50">28</div>
              <div class="hf-calendar-cell text-muted opacity-50">29</div>
              <div class="hf-calendar-cell text-muted opacity-50">30</div>
              <div class="hf-calendar-cell">1</div>
              <div class="hf-calendar-cell">2</div>
              <!-- Week 2 -->
              <div class="hf-calendar-cell">3</div>
              <div class="hf-calendar-cell">4</div>
              <div class="hf-calendar-cell">5</div>
              <div class="hf-calendar-cell">6</div>
              <div class="hf-calendar-cell">7</div>
              <div class="hf-calendar-cell">8</div>
              <div class="hf-calendar-cell">9</div>
              <!-- Week 3 (Tournament dates) -->
              <div class="hf-calendar-cell">10</div>
              <div class="hf-calendar-cell">11</div>
              <div class="hf-calendar-cell">12</div>
              <div class="hf-calendar-cell">13</div>
              <div class="hf-calendar-cell">14</div>
              <div class="hf-calendar-cell">15<span class="hf-calendar-dot"></span></div>
              <div class="hf-calendar-cell active">16<span class="hf-calendar-dot"></span></div>
              <!-- Week 4 -->
              <div class="hf-calendar-cell">17</div>
              <div class="hf-calendar-cell">18<span class="hf-calendar-dot"></span></div>
              <div class="hf-calendar-cell">19</div>
              <div class="hf-calendar-cell">20</div>
              <div class="hf-calendar-cell">21</div>
              <div class="hf-calendar-cell">22<span class="hf-calendar-dot"></span></div>
              <div class="hf-calendar-cell">23</div>
            </div>
          </div>

          <!-- Court Filter Tabs -->
          <div class="hf-card p-3 bg-white">
            <span class="small fw-bold text-muted text-uppercase d-block mb-2">Court Filter</span>
            <div class="d-flex flex-wrap gap-2">
              <button class="btn btn-sm btn-hf-primary py-1 px-3">All Courts</button>
              <button class="btn btn-sm btn-hf-outline py-1 px-3">Court 1 (Main Gym)</button>
              <button class="btn btn-sm btn-hf-outline py-1 px-3">Court 2 (Covered)</button>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-7">
          <!-- Day's Scheduled Matchups -->
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold text-dark fs-6">Scheduled Matches &bull; Saturday, May 16, 2026</span>
            <a href="matches.html" class="small text-decoration-none" style="color: var(--hf-primary);">Matchup Cards</a>
          </div>

          <div id="dayScheduleList">
            <!-- Rendered by JS -->
          </div>
        </div>
      </div>
    </main>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const db = window.HF.get();
      const listEl = document.getElementById('dayScheduleList');

      listEl.innerHTML = db.bracketMatches.slice(0, 4).map(m => `
        <div class="hf-card p-3 mb-2">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="badge bg-light text-dark border"><i class="bi bi-geo-alt me-1 text-primary"></i>${m.court}</span>
            <span class="small text-muted fw-bold"><i class="bi bi-clock me-1"></i>${m.time.split('-')[1]}</span>
          </div>
          <div class="d-flex justify-content-between align-items-center my-2">
            <div class="fw-bold fs-6">${m.team1}</div>
            <span class="badge bg-secondary-subtle text-muted">VS</span>
            <div class="fw-bold fs-6">${m.team2}</div>
          </div>
          <div class="d-flex justify-content-between align-items-center pt-2 mt-2 border-top">
            <span class="small text-success fw-bold"><i class="bi bi-check-circle-fill me-1"></i>${m.status} (${m.score1} - ${m.score2})</span>
            <a href="../games/stats.html?match=${m.id}" class="btn btn-sm btn-hf-outline py-1 px-3" style="font-size: 0.75rem;">
              Box Score &amp; Stats <i class="bi bi-chevron-right ms-1"></i>
            </a>
          </div>
        </div>
      `).join('');
    });
  </script>
</body>
</html>
