<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Announcements &amp; Notifications — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content pb-5">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="fw-bold mb-0">Announcements &amp; Alerts</h5>
        <span class="badge bg-warning text-dark">Live Feed</span>
      </div>

      <!-- Search (matches wireframe) -->
      <div class="hf-search-box mb-3">
        <input type="text" placeholder="Search notices, schedules, or memo updates..." id="annSearch">
        <i class="bi bi-search"></i>
      </div>

      <!-- Feed List -->
      <div id="announcementsFeed">
        <!-- Rendered by JS -->
      </div>

      <!-- Organizer Action: Create Announcement (matches wireframe 31:801) -->
      <div class="pt-3" data-role-required="organizer">
        <a href="create.html" class="btn btn-hf-primary w-100 py-3 fs-6 d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-megaphone-fill"></i> Create New Announcement
        </a>
      </div>
    </main>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const db = window.HF.get();
      const feedEl = document.getElementById('announcementsFeed');

      function render(items) {
        feedEl.innerHTML = items.map(a => `
          <div class="hf-card p-3 mb-3 bg-white">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <span class="badge bg-light text-dark border"><i class="bi bi-tag me-1"></i>${a.category}</span>
              <small class="text-muted"><i class="bi bi-clock me-1"></i>${a.date}</small>
            </div>
            <h6 class="fw-bold text-dark mb-1">${a.title}</h6>
            <p class="small text-muted mb-2">${a.content}</p>
            <div class="pt-2 border-top small text-secondary d-flex justify-content-between">
              <span><i class="bi bi-person-circle me-1"></i>${a.author}</span>
              <span class="text-primary fw-semibold"><i class="bi bi-shield-check me-1"></i>Official</span>
            </div>
          </div>
        `).join('');
      }

      render(db.announcements);

      document.getElementById('annSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        render(db.announcements.filter(a => a.title.toLowerCase().includes(q) || a.content.toLowerCase().includes(q)));
      });
    });
  </script>
</body>
</html>
