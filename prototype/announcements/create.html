<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Announcement — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content pb-5">
      <div class="mb-3">
        <h5 class="fw-bold mb-1">Broadcast Announcement</h5>
        <p class="text-muted small">Send urgent tournament notifications, schedule shifts, or venue alerts.</p>
      </div>

      <form id="createAnnForm" onsubmit="handleCreateAnnouncement(event)">
        <!-- Select Tournament (matches wireframe 31:824) -->
        <div class="mb-3">
          <label class="form-label small fw-bold text-dark">Target Tournament</label>
          <select id="annTourneySelect" class="form-select" required>
            <option value="All Tournaments">Broadcast to All Tournaments</option>
            <option value="tourney-1" selected>Barangay Summer Youth Cup 2026</option>
            <option value="tourney-2">Metro Manila High School Open</option>
            <option value="tourney-3">Cagayan de Oro Grassroots Classic</option>
          </select>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-bold text-dark">Subject / Title</label>
          <input type="text" id="annTitle" class="form-control" placeholder="e.g. Weather Advisory: Afternoon matches moved indoors" required>
        </div>

        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small fw-bold text-dark">Category</label>
            <select id="annCategory" class="form-select">
              <option value="Schedule">Schedule Change</option>
              <option value="Venue">Venue Advisory</option>
              <option value="Eligibility">Eligibility / PSA Notice</option>
              <option value="General">General Announcement</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold text-dark">Audience</label>
            <select class="form-select">
              <option value="All">All Participants &amp; Fans</option>
              <option value="Coaches">Coaches Only</option>
              <option value="Referees">Referees &amp; Scorekeepers</option>
            </select>
          </div>
        </div>

        <!-- Announcement Text Area (matches wireframe) -->
        <div class="mb-4">
          <label class="form-label small fw-bold text-dark">Announcement Message</label>
          <textarea id="annContent" class="form-control" rows="5" placeholder="Type official bulletin details here..." required></textarea>
        </div>

        <div class="pt-2">
          <button type="submit" class="btn btn-hf-primary w-100 py-3 fs-6">
            <i class="bi bi-send-fill me-1"></i> Publish Announcement
          </button>
        </div>
      </form>
    </main>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    function handleCreateAnnouncement(e) {
      e.preventDefault();
      const db = window.HF.get();
      const newAnn = {
        id: 'ann-' + (db.announcements.length + 1),
        title: document.getElementById('annTitle').value,
        content: document.getElementById('annContent').value,
        category: document.getElementById('annCategory').value,
        author: 'Tournament Committee',
        date: 'Just now'
      };

      db.announcements.unshift(newAnn);
      window.HF.save(db);
      alert('Announcement published to all tournament participants!');
      window.location.href = 'index.html';
    }
  </script>
</body>
</html>
