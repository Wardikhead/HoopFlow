<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournament Standings Table — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content pb-5">
      <!-- Standings Header -->
      <div class="d-flex justify-content-between align-items-center mb-2">
        <div>
          <h5 class="fw-bold mb-0">Official Standings</h5>
          <small class="text-muted">U18 Division &bull; Summer Youth Cup</small>
        </div>
        <!-- "Change Bracket" button (matches wireframe) -->
        <a href="../brackets/view.html" class="btn btn-sm btn-hf-outline py-1 px-2" style="font-size: 0.75rem;">
          <i class="bi bi-arrow-left-right me-1"></i> Change Bracket
        </a>
      </div>

      <!-- Quick Filter Pills -->
      <div class="hf-filter-pills">
        <button class="hf-filter-pill active" onclick="setStandingsFilter(this, 'all')">All Teams (8)</button>
        <button class="hf-filter-pill" onclick="setStandingsFilter(this, 'playoff')">Playoff Qualifiers (Top 4)</button>
        <button class="hf-filter-pill" onclick="setStandingsFilter(this, 'streak')">Win Streak &gt; 0</button>
      </div>

      <!-- Search Bar (matches wireframe) -->
      <div class="hf-search-box mb-3">
        <input type="text" placeholder="Search team in standings..." id="tableSearch">
        <i class="bi bi-search"></i>
      </div>

      <!-- STANDINGS TABLE (Matches wireframe 23:2056 / 27:610) -->
      <div class="hf-card p-0 overflow-hidden mb-3">
        <div class="table-responsive">
          <table class="hf-table">
            <thead>
              <tr>
                <th style="width: 38px;">#</th>
                <th>Team</th>
                <th class="text-center">W</th>
                <th class="text-center">L</th>
                <th class="text-center">WS</th>
                <th class="text-center">LS</th>
                <th class="text-center">Diff</th>
              </tr>
            </thead>
            <tbody id="standingsTableBody">
              <!-- Rendered by JS -->
            </tbody>
          </table>
        </div>
      </div>

      <!-- Legend & Tiebreaker Rules (matches project PRD doc 10.3 / 11) -->
      <div class="hf-card p-3 bg-white">
        <span class="small fw-bold text-dark d-block mb-1">SBP Youth Tiebreaker Rules:</span>
        <ol class="small text-muted ps-3 mb-0" style="font-size: 0.75rem;">
          <li>Total games won / win percentage</li>
          <li>Head-to-head match result between tied squads</li>
          <li>Overall points differential (+/-)</li>
          <li>Higher total points scored</li>
        </ol>
      </div>
    </main>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const db = window.HF.get();
      const tbody = document.getElementById('standingsTableBody');
      let activeFilter = 'all';

      // Sort teams by wins descending, then by points diff
      const sortedTeams = [...db.teams].sort((a, b) => b.wins - a.wins);

      window.setStandingsFilter = function(btn, filter) {
        document.querySelectorAll('.hf-filter-pill').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = filter;
        applyFilters();
      };

      function render(teams) {
        tbody.innerHTML = teams.map((team, index) => {
          const rank = sortedTeams.findIndex(t => t.id === team.id) + 1;
          const isPlayoffSpot = rank <= 4;
          return `
            <tr>
              <td class="text-center">
                <span class="badge ${isPlayoffSpot ? 'bg-primary-subtle text-primary fw-bold' : 'bg-light text-muted border'} rounded-circle" style="width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center;">
                  ${rank}
                </span>
              </td>
              <td>
                <a href="../teams/show.html?id=${team.id}" class="text-decoration-none text-dark d-flex align-items-center gap-2">
                  <div class="hf-avatar text-white" style="background: ${team.avatarColor}; width: 28px; height: 28px; font-size: 0.7rem;">
                    ${team.shortName}
                  </div>
                  <div>
                    <span class="fw-bold d-block text-truncate" style="max-width: 140px;">${team.name}</span>
                    <small class="text-muted" style="font-size: 0.65rem;">${team.city}</small>
                  </div>
                </a>
              </td>
              <td class="text-center fw-bold text-dark">${team.wins}</td>
              <td class="text-center text-muted">${team.losses}</td>
              <td class="text-center"><span class="badge bg-success-subtle text-success">${team.winStreak}</span></td>
              <td class="text-center"><span class="badge bg-danger-subtle text-danger">${team.lossStreak}</span></td>
              <td class="text-center small fw-semibold text-secondary">${team.pointsDiff}</td>
            </tr>
          `;
        }).join('');
      }

      function applyFilters() {
        const q = document.getElementById('tableSearch').value.toLowerCase();
        let list = sortedTeams.filter(t => t.name.toLowerCase().includes(q) || t.city.toLowerCase().includes(q));
        if (activeFilter === 'playoff') {
          list = list.slice(0, 4);
        } else if (activeFilter === 'streak') {
          list = list.filter(t => t.winStreak > 0);
        }
        render(list);
      }

      render(sortedTeams);
      document.getElementById('tableSearch').addEventListener('input', applyFilters);
    });
  </script>
</body>
</html>
