<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Team & Roster — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content pb-5">
      <!-- Team Header Card (matches wireframe 31:950) -->
      <div class="hf-card p-3 mb-3" style="background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%); color: #fff;">
        <div class="d-flex align-items-center justify-content-between">
          <div class="d-flex align-items-center gap-3">
            <div class="hf-avatar hf-avatar-lg text-white" style="background: #ea580c; border: 2px solid #fff;">
              VPR
            </div>
            <div>
              <h5 class="fw-bold mb-0">San Antonio Vipers</h5>
              <span class="badge bg-warning text-dark fw-bold">U18 Division</span>
              <div class="small text-light opacity-75 mt-1">Head Coach: Marcus Rivera</div>
            </div>
          </div>
        </div>

        <div class="mt-3 pt-2 border-top border-secondary d-flex justify-content-between align-items-center">
          <span class="small text-light opacity-75"><i class="bi bi-shield-check text-success me-1"></i> Roster Locked (8/8)</span>
          <button type="button" class="btn btn-sm btn-outline-light rounded-pill px-3 py-1" onclick="openAddPlayerModal()">
            <i class="bi bi-person-plus me-1"></i> Add Player
          </button>
        </div>
      </div>

      <!-- Roster Search -->
      <div class="hf-search-box mb-3">
        <input type="text" placeholder="Search roster by name, jersey #, position..." id="myRosterSearch">
        <i class="bi bi-search"></i>
      </div>

      <!-- Player Roster List (matches wireframe table) -->
      <div class="hf-card p-0 overflow-hidden mb-3">
        <div class="p-3 bg-light border-bottom d-flex justify-content-between align-items-center">
          <span class="fw-bold small text-muted text-uppercase">Player List</span>
          <span class="badge bg-success-subtle text-success">All Eligible</span>
        </div>
        <div class="list-group list-group-flush" id="myRosterList">
          <!-- Rendered by JS -->
        </div>
      </div>
    </main>

    <!-- Add/Edit Player Modal -->
    <div class="modal fade" id="playerModal" tabindex="-1">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header">
            <h6 class="modal-title fw-bold">Add Player to Roster</h6>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label small fw-bold">Full Name (Per PSA Birth Certificate)</label>
              <input type="text" id="newPlayerName" class="form-control" placeholder="e.g. Juan De La Cruz" required>
            </div>
            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label small fw-bold">Jersey Number</label>
                <input type="number" id="newPlayerNumber" class="form-control" placeholder="23" required>
              </div>
              <div class="col-6">
                <label class="form-label small fw-bold">Age</label>
                <input type="number" id="newPlayerAge" class="form-control" placeholder="17" required>
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label small fw-bold">Primary Position</label>
              <select id="newPlayerPos" class="form-select">
                <option value="Point Guard (PG)">Point Guard (PG)</option>
                <option value="Shooting Guard (SG)">Shooting Guard (SG)</option>
                <option value="Small Forward (SF)">Small Forward (SF)</option>
                <option value="Power Forward (PF)">Power Forward (PF)</option>
                <option value="Center (C)">Center (C)</option>
              </select>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="guardianConsentCheck" checked required>
              <label class="form-check-label small text-muted" for="guardianConsentCheck">
                Parent/Guardian signed waiver on file
              </label>
            </div>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-sm btn-secondary" data-bs-dismiss="modal">Cancel</button>
            <button type="button" class="btn btn-sm btn-hf-primary" onclick="saveNewPlayer()">Save to Roster</button>
          </div>
        </div>
      </div>
    </div>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const db = window.HF.get();
      const listEl = document.getElementById('myRosterList');
      const modal = new bootstrap.Modal(document.getElementById('playerModal'));

      function render(players) {
        listEl.innerHTML = players.map(p => `
          <div class="list-group-item d-flex align-items-center justify-content-between py-2 px-3">
            <div class="d-flex align-items-center gap-3">
              <div class="hf-avatar text-white" style="background: #334155; width: 38px; height: 38px; font-size: 0.85rem;">
                #${p.number}
              </div>
              <div>
                <div class="fw-bold text-dark mb-0">${p.name}</div>
                <small class="text-muted">${p.pos} &bull; Age ${p.age}</small>
              </div>
            </div>
            <div class="text-end">
              <span class="badge bg-success-subtle text-success small d-block mb-1">
                <i class="bi bi-patch-check-fill me-1"></i>Verified
              </span>
              <small class="text-muted" style="font-size: 0.65rem;">PSA Checked</small>
            </div>
          </div>
        `).join('');
      }

      window.openAddPlayerModal = function() {
        modal.show();
      };

      window.saveNewPlayer = function() {
        const name = document.getElementById('newPlayerName').value;
        const number = document.getElementById('newPlayerNumber').value;
        const age = document.getElementById('newPlayerAge').value;
        const pos = document.getElementById('newPlayerPos').value;

        if (!name || !number || !age) {
          alert('Please fill out all fields.');
          return;
        }

        db.players.push({
          id: 'p-' + (db.players.length + 1),
          name: name,
          number: parseInt(number),
          pos: pos,
          age: parseInt(age),
          verified: true
        });

        window.HF.save(db);
        modal.hide();
        render(db.players);
      };

      render(db.players);

      document.getElementById('myRosterSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        render(db.players.filter(p => p.name.toLowerCase().includes(q) || p.number.toString().includes(q) || p.pos.toLowerCase().includes(q)));
      });
    });
  </script>
</body>
</html>
