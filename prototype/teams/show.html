<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Profile — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content pb-5">
      <!-- DESKTOP 2-COLUMN VIEW -->
      <div class="row g-4">
        <!-- LEFT COLUMN: TEAM IDENTITY & COACH -->
        <div class="col-12 col-lg-4">
          <!-- Team Header & Record Pills (matches wireframe 8:89) -->
          <div class="hf-card text-center p-4 mb-3">
            <div class="hf-avatar hf-avatar-xl mx-auto mb-2 text-white shadow-sm" id="teamAvatar" style="background: #ea580c;">
              VPR
            </div>
            <h4 class="fw-bold mb-1" id="teamName">San Antonio Vipers</h4>
            <span class="badge bg-light text-muted border mb-3" id="teamCity">Pasig City</span>

            <!-- Win / Loss Badges (matches wireframe) -->
            <div class="d-flex justify-content-center gap-3">
              <div class="px-3 py-2 bg-success-subtle border border-success rounded-3 text-center" style="min-width: 90px;">
                <span class="fs-4 fw-bold text-success d-block" id="teamWins">4</span>
                <span class="small text-success fw-semibold text-uppercase" style="font-size: 0.65rem;">Team Wins</span>
              </div>
              <div class="px-3 py-2 bg-danger-subtle border border-danger rounded-3 text-center" style="min-width: 90px;">
                <span class="fs-4 fw-bold text-danger d-block" id="teamLosses">0</span>
                <span class="small text-danger fw-semibold text-uppercase" style="font-size: 0.65rem;">Team Loses</span>
              </div>
            </div>
          </div>

          <!-- Leader Profile / Coach Card (matches wireframe bottom) -->
          <div class="hf-card p-3 mb-3 bg-white">
            <span class="text-muted small fw-bold text-uppercase d-block mb-2">Team Leadership</span>
            <div class="d-flex align-items-center gap-3">
              <div class="hf-avatar bg-dark text-white" style="width: 48px; height: 48px;">
                <i class="bi bi-person-fill fs-4"></i>
              </div>
              <div>
                <h6 class="fw-bold mb-0" id="coachName">Coach Marcus Rivera</h6>
                <small class="text-muted d-block">Head Coach &bull; SBP Level 1 Accredited</small>
                <span class="badge bg-success-subtle text-success small mt-1">Verified License</span>
              </div>
            </div>
          </div>
        </div>

        <!-- RIGHT COLUMN: OFFICIAL ROSTER -->
        <div class="col-12 col-lg-8">
          <div class="d-flex justify-content-between align-items-center mb-2">
            <span class="fw-bold text-dark fs-6">Official Team Roster</span>
            <span class="badge bg-light text-dark border">6 Active Players &bull; PSA Verified</span>
          </div>

          <div class="hf-search-box mb-3">
            <input type="text" placeholder="Search player name or number..." id="rosterSearch">
            <i class="bi bi-search"></i>
          </div>

          <div class="hf-card p-0 overflow-hidden mb-3">
            <div class="list-group list-group-flush" id="rosterList">
              <!-- Rendered by JS -->
            </div>
          </div>
        </div>
      </div>
    </main>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const db = window.HF.get();
      const params = new URLSearchParams(window.location.search);
      const teamId = params.get('id') || 'team-1';
      const team = db.teams.find(t => t.id === teamId) || db.teams[0];

      document.getElementById('teamName').textContent = team.name;
      document.getElementById('teamCity').textContent = team.city;
      document.getElementById('teamWins').textContent = team.wins;
      document.getElementById('teamLosses').textContent = team.losses;
      document.getElementById('coachName').textContent = `Coach ${team.coach}`;
      
      const avatarEl = document.getElementById('teamAvatar');
      avatarEl.textContent = team.shortName;
      avatarEl.style.backgroundColor = team.avatarColor;

      const rosterEl = document.getElementById('rosterList');
      function renderRoster(players) {
        rosterEl.innerHTML = players.map(p => `
          <div class="list-group-item d-flex align-items-center justify-content-between py-3 px-3">
            <div class="d-flex align-items-center gap-3">
              <span class="badge bg-secondary-subtle text-dark fw-bold fs-6" style="width: 36px; text-align: center;">#${p.number}</span>
              <div>
                <div class="fw-bold text-dark mb-0">${p.name}</div>
                <small class="text-muted">${p.pos} &bull; Age ${p.age}</small>
              </div>
            </div>
            <div class="text-end">
              <span class="badge bg-success-subtle text-success small d-block mb-1"><i class="bi bi-check-circle me-1"></i>Eligible</span>
              <small class="text-muted" style="font-size: 0.65rem;">Parent Consent Signed</small>
            </div>
          </div>
        `).join('');
      }

      renderRoster(db.players);

      document.getElementById('rosterSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        renderRoster(db.players.filter(p => p.name.toLowerCase().includes(q) || p.number.toString().includes(q)));
      });
    });
  </script>
</body>
</html>
