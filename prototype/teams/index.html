<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams Directory — HoopFlow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/hoopflow.css">
</head>
<body>
  <div class="app-container">
    <div id="hfTopbarContainer"></div>

    <main class="hf-content">
      <div class="d-flex justify-content-between align-items-center mb-2">
        <h5 class="fw-bold mb-0">Registered Teams</h5>
        <span class="badge bg-secondary-subtle text-secondary" id="totalTeamsCount">Total Teams: 8</span>
      </div>

      <!-- Search Bar (matches wireframe) -->
      <div class="hf-search-box mb-2">
        <input type="text" placeholder="Search team name, city, or coach..." id="teamsSearch">
        <i class="bi bi-search"></i>
      </div>

      <div class="d-flex justify-content-between align-items-center mb-3">
        <div class="dropdown">
          <button class="btn btn-sm btn-hf-outline dropdown-toggle py-1" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-filter me-1"></i> Filter: All
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">All Teams</a></li>
            <li><a class="dropdown-item" href="#">Approved</a></li>
            <li><a class="dropdown-item" href="#">Pending</a></li>
          </ul>
        </div>
        <div class="dropdown">
          <button class="btn btn-sm btn-hf-outline dropdown-toggle py-1" type="button" data-bs-toggle="dropdown">
            <i class="bi bi-sort-down me-1"></i> Sort By: Wins
          </button>
          <ul class="dropdown-menu">
            <li><a class="dropdown-item" href="#">Wins (Highest)</a></li>
            <li><a class="dropdown-item" href="#">Team Name (A-Z)</a></li>
          </ul>
        </div>
      </div>

      <!-- Responsive Grid of Team Cards (3 cols mobile, 4-6 cols desktop) -->
      <div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-4 g-3 mb-3" id="teamsGridContainer">
        <!-- Rendered by JS -->
      </div>

      <!-- Pagination (matches wireframe) -->
      <div class="d-flex justify-content-center gap-2 py-3">
        <span class="hf-splash-dot active"></span>
        <span class="hf-splash-dot"></span>
        <span class="hf-splash-dot"></span>
      </div>
    </main>

    <div id="hfBottomNavContainer"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/mock-data.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/navigation.js"></script>
  <script src="../assets/js/role-switcher.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const db = window.HF.get();
      const grid = document.getElementById('teamsGridContainer');
      const countEl = document.getElementById('totalTeamsCount');

      function render(teams) {
        countEl.textContent = `Total Teams: ${teams.length}`;
        grid.innerHTML = teams.map(team => `
          <div class="col">
            <a href="show.html?id=${team.id}" class="text-decoration-none">
              <div class="hf-card text-center p-2 mb-0 h-100 hf-card-interactive">
                <div class="hf-avatar mx-auto mb-2 text-white" style="background: ${team.avatarColor}; width: 44px; height: 44px; font-size: 0.85rem;">
                  ${team.shortName}
                </div>
                <div class="fw-bold text-dark text-truncate" style="font-size: 0.75rem;">${team.name}</div>
                <small class="text-muted d-block" style="font-size: 0.65rem;">${team.city}</small>
                <div class="mt-1 badge bg-light text-dark border" style="font-size: 0.65rem;">
                  ${team.wins}W - ${team.losses}L
                </div>
              </div>
            </a>
          </div>
        `).join('');
      }

      render(db.teams);

      document.getElementById('teamsSearch').addEventListener('input', (e) => {
        const q = e.target.value.toLowerCase();
        render(db.teams.filter(t => t.name.toLowerCase().includes(q) || t.coach.toLowerCase().includes(q) || t.city.toLowerCase().includes(q)));
      });
    });
  </script>
</body>
</html>
